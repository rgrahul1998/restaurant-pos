# Dev services only. Host ports are offset (5433 / 6380) so they don't collide
# with a Postgres or Redis already running on this machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

volumes:
  pgdata:
