# Production stack on the server. Settings come from .env next to this file
# (see env.example). deploy.sh copies this file to the VM and runs it.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend: &backend
    image: ${IMAGE_REPO}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pos:${POSTGRES_PASSWORD}@db:5432/pos
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /data/backups
      QZ_CERTIFICATE_FILE: /certs/qz-certificate.pem
      QZ_PRIVATE_KEY_FILE: /certs/qz-private-key.pem
    volumes:
      - media:/app/media
      - /var/lib/pos/backups:/data/backups
      - ./certs:/certs:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    <<: *backend
    command: ["python", "manage.py", "backup_worker"]
    depends_on:
      backend: { condition: service_started }

  web:
    image: ${IMAGE_REPO}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
